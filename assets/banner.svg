<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="dirdiff">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#g)"/>
  <text x="60" y="95" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="54" font-weight="700" fill="#e2e8f0" opacity="0">dirdiff
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <text x="62" y="135" font-family="system-ui,Segoe UI,sans-serif" font-size="20" fill="#94a3b8" opacity="0">Compare two folders. Instantly.
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1s" fill="freeze"/>
  </text>
  <g transform="translate(540,45)">
    <rect width="130" height="110" rx="10" fill="#334155"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">A</text>
    <rect x="12" y="34" width="100" height="10" rx="5" fill="#22c55e" opacity=".7"/>
    <rect x="12" y="58" width="100" height="10" rx="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="82" width="100" height="10" rx="5" fill="#f59e0b">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(710,45)">
    <rect width="130" height="110" rx="10" fill="#334155"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">B</text>
    <rect x="12" y="34" width="100" height="10" rx="5" fill="#22c55e" opacity=".7"/>
    <rect x="12" y="58" width="100" height="10" rx="5" fill="none" stroke="#64748b" stroke-dasharray="4 4"/>
    <rect x="12" y="82" width="100" height="10" rx="5" fill="#f59e0b">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M676 100 h28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
</svg>
