<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">DirDiff</title><desc id="d">Two folder trees are compared and differences are highlighted.</desc><defs><linearGradient id="bg"><stop stop-color="#19283e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#142a40" stroke="#62e3c1" stroke-width="2"><rect x="90" y="80" width="300" height="170" rx="12"/><rect x="810" y="80" width="300" height="170" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="125" y="115">FOLDER A</text><text x="845" y="115">FOLDER B</text><text x="125" y="160">app.py</text><text x="125" y="195">config.json</text><text x="125" y="230">notes.md</text><text x="845" y="160">app.py</text><text x="845" y="195">config.json</text><text x="845" y="230">readme.md</text></g><path d="M390 165H810" stroke="#8fa8ff" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><circle cx="600" cy="165" r="35" fill="#102d32" stroke="#62e3c1" stroke-width="3"/><text x="600" y="173" text-anchor="middle" fill="#edf3ff" font-family="monospace" font-size="24">≠</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DIRDIFF</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">COMPARE / DETECT / REPORT</text></svg>